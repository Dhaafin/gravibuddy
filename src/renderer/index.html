<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gravibuddy</title>
  <!-- Apple SF Pro Equivalent: Inter Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="island-root" id="islandRoot">
    
    <!-- MacBook-Grade Attached Hardware Notch -->
    <div class="island" id="island">
      <!-- Concave Notch Fillets (Seamless Top Screen Bezel Integration) -->
      <div class="notch-ear notch-ear-left" id="notchEarLeft"></div>
      <div class="notch-ear notch-ear-right" id="notchEarRight"></div>
      
      <!-- Leading Dynamic Accessory (Official Antigravity Logo) -->
      <div class="leading-accessory" id="leadingAccessory">
        <div class="logo-orb" id="logoOrb">
          <div class="logo-aura" id="logoAura"></div>
          <div class="logo-backdrop" id="logoBackdrop">
            <img src="assets/antigravity-icon.png" alt="Antigravity Logo" class="agy-logo-img" id="agyLogoImg">
          </div>
        </div>

        <!-- Waveform overlay for Thinking State -->
        <div class="mini-waveform" id="miniWaveform">
          <span class="bar bar-1"></span>
          <span class="bar bar-2"></span>
          <span class="bar bar-3"></span>
        </div>
      </div>

      <!-- Center Typography Area (Horizontal Mode) -->
      <div class="island-content" id="islandContent">
        <div class="primary-label" id="primaryLabel">Antigravity</div>
        <div class="secondary-label" id="secondaryLabel">Ready & listening</div>
      </div>

      <!-- Vertical Mode Stack (Clean Stacked Badges) -->
      <div class="vertical-stack" id="verticalStack">
        <div class="v-divider"></div>
        <span class="v-badge v-state" id="vState">IDLE</span>
        <span class="v-badge v-quota" id="vQuota">94%</span>
        <div class="v-divider"></div>
      </div>

      <!-- Trailing Controls (Metrics + Settings Button) -->
      <div class="trailing-accessory" id="trailingAccessory">
        <!-- Metric Capsule (Horizontal mode) -->
        <div class="metric-capsule" id="metricCapsule">
          <span class="metric-dot"></span>
          <span class="metric-val" id="metricVal">READY</span>
        </div>

        <!-- Settings Icon Button -->
        <button class="settings-btn" id="btnSettings" title="Settings">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>

      <!-- Sleep Notch Tab Indicator (Option 1: Minimalist Glowing Status Tab) -->
      <div class="sleep-indicator" id="sleepIndicator">
        <span class="sleep-bar"></span>
      </div>
    </div>

    <!-- macOS / VisionOS Control Center Style Settings Card -->
    <div class="settings-card" id="settingsCard">
      <div class="card-header">
        <div class="header-left">
          <div class="header-logo-badge">
            <img src="assets/antigravity-icon.png" width="14" height="14" alt="Icon">
          </div>
          <span class="card-title">Gravibuddy</span>
          <span class="card-badge">PRO</span>
        </div>
        <button class="card-close-btn" id="btnCloseSettings" aria-label="Close settings">
          <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Docking Position Segmented Control -->
      <div class="setting-group">
        <div class="setting-label">DOCK POSITION</div>
        <div class="segmented-control">
          <button class="segment-btn" data-pos="left" id="btnPosLeft">
            <span class="segment-icon">◧</span> Left
          </button>
          <button class="segment-btn active" data-pos="center" id="btnPosCenter">
            <span class="segment-icon">⬒</span> Notch
          </button>
          <button class="segment-btn" data-pos="right" id="btnPosRight">
            <span class="segment-icon">◨</span> Right
          </button>
        </div>
      </div>

      <!-- Preferences Section -->
      <div class="setting-group">
        <div class="setting-label">PREFERENCES</div>
        
        <div class="settings-surface">
          <!-- Stealth Mode Row -->
          <div class="setting-row" id="btnToggleStealth">
            <div class="row-info">
              <span class="row-label">Stealth Mode</span>
              <span class="row-sub">Stays tucked while coding, pops on alert</span>
            </div>
            <div class="apple-toggle active" id="appleToggleStealth">
              <div class="toggle-thumb"></div>
            </div>
          </div>

          <div class="row-divider"></div>

          <!-- Auto-Sleep Row -->
          <div class="setting-row" id="btnToggleSleep">
            <div class="row-info">
              <span class="row-label">Auto Sleep</span>
              <span class="row-sub">Retracts to screen rim when idle</span>
            </div>
            <div class="apple-toggle active" id="appleToggleSleep">
              <div class="toggle-thumb"></div>
            </div>
          </div>

          <div class="row-divider"></div>

          <!-- Sound Effects Row -->
          <div class="setting-row" id="btnToggleSound">
            <div class="row-info">
              <span class="row-label">Audio Feedback</span>
              <span class="row-sub">Subtle spatial chimes and pops</span>
            </div>
            <div class="apple-toggle active" id="appleToggleSound">
              <div class="toggle-thumb"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Live Simulation Section -->
      <div class="setting-group" style="margin-top: 12px; margin-bottom: 2px;">
        <div class="setting-label">PREVIEW STATES</div>
        <div class="test-pill-grid">
          <button class="test-pill test-pill-thinking" id="testThinking" title="Preview Coding State">
            <span class="pill-dot dot-thinking"></span>
            <span>Coding</span>
          </button>
          <button class="test-pill test-pill-done" id="testDone" title="Preview Completed State">
            <span class="pill-dot dot-done"></span>
            <span>Done</span>
          </button>
          <button class="test-pill test-pill-wait" id="testWait" title="Preview Action Required State">
            <span class="pill-dot dot-wait"></span>
            <span>Action</span>
          </button>
          <button class="test-pill test-pill-sleep" id="testSleep" title="Preview Sleep Notch">
            <span class="pill-dot dot-sleep"></span>
            <span>Sleep</span>
          </button>
          <button class="test-pill test-pill-idle" id="testIdle" title="Reset to Standby">
            <span class="pill-dot dot-idle"></span>
            <span>Reset</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
