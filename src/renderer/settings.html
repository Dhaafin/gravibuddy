<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gravibuddy Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .spotlight-card {
      position: relative !important;
      top: 0 !important;
      left: 0 !important;
      width: 312px !important;
      box-shadow: 
        0 28px 65px -6px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(255, 255, 255, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.25) !important;
      
      /* Sleek Morph-y Closed State */
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transform: scale(0.86) translateY(-14px) !important;
      filter: blur(14px) !important;
      transform-origin: center top !important;

      /* Apple Spring Physics Transition */
      transition: 
        transform 0.38s cubic-bezier(0.34, 1.42, 0.64, 1),
        opacity 0.24s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.26s cubic-bezier(0.16, 1, 0.3, 1),
        visibility 0.38s !important;
      will-change: transform, opacity, filter;
    }

    /* Sleek Morph-y Opened State */
    .spotlight-card.opened {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      transform: scale(1) translateY(0) !important;
      filter: blur(0px) !important;
    }

    /* Sleek Morph-y Closing State */
    .spotlight-card.closing {
      opacity: 0 !important;
      visibility: visible !important;
      pointer-events: none !important;
      transform: scale(0.90) translateY(-12px) !important;
      filter: blur(10px) !important;
      transition: 
        transform 0.20s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.16s ease,
        filter 0.16s ease !important;
    }
  </style>
</head>
<body>
  <div class="settings-card spotlight-card" id="settingsCard">
    <div class="card-header">
      <div class="header-left">
        <div class="header-logo-badge">
          <img src="../../assets/antigravity-icon.png" width="14" height="14" alt="Icon">
        </div>
        <span class="card-title">Gravibuddy</span>
        <span class="card-badge">PRO</span>
      </div>
      <button class="card-close-btn" id="btnCloseSettings" aria-label="Close settings">
        <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>


    <!-- Docking Position Segmented Control -->
    <div class="setting-group">
      <div class="setting-label">DOCK POSITION</div>
      <div class="segmented-control">
        <button class="segment-btn" data-pos="left" id="btnPosLeft">
          <span class="segment-icon">◧</span> Left
        </button>
        <button class="segment-btn active" data-pos="center" id="btnPosCenter">
          <span class="segment-icon">⬒</span> Notch
        </button>
        <button class="segment-btn" data-pos="right" id="btnPosRight">
          <span class="segment-icon">◨</span> Right
        </button>
      </div>
    </div>

    <!-- Preferences Section -->
    <div class="setting-group">
      <div class="setting-label">PREFERENCES</div>
      
      <div class="settings-surface">
        <!-- Stealth Mode Row -->
        <div class="setting-row" id="btnToggleStealth">
          <div class="row-info">
            <span class="row-label">Stealth Mode</span>
            <span class="row-sub">Stays tucked while coding, pops on alert</span>
          </div>
          <div class="apple-toggle active" id="appleToggleStealth">
            <div class="toggle-thumb"></div>
          </div>
        </div>

        <div class="row-divider"></div>

        <!-- Peek on Start Row -->
        <div class="setting-row" id="btnToggleThinkingPreview">
          <div class="row-info">
            <span class="row-label">Peek on Start</span>
            <span class="row-sub">Pop up sejenak lalu sleep saat mulai kerja</span>
          </div>
          <div class="apple-toggle active" id="appleToggleThinkingPreview">
            <div class="toggle-thumb"></div>
          </div>
        </div>

        <div class="row-divider"></div>

        <!-- Auto-Sleep Row -->
        <div class="setting-row" id="btnToggleSleep">
          <div class="row-info">
            <span class="row-label">Auto Sleep</span>
            <span class="row-sub">Retracts to screen rim when idle</span>
          </div>
          <div class="apple-toggle active" id="appleToggleSleep">
            <div class="toggle-thumb"></div>
          </div>
        </div>

        <div class="row-divider"></div>

        <!-- Sound Effects Row -->
        <div class="setting-row" id="btnToggleSound">
          <div class="row-info">
            <span class="row-label">Audio Feedback</span>
            <span class="row-sub">Subtle spatial chimes and pops</span>
          </div>
          <div class="apple-toggle active" id="appleToggleSound">
            <div class="toggle-thumb"></div>
          </div>
        </div>
      </div>
    </div>


    <!-- Quit Application Row -->
    <div class="setting-group" style="margin-top: 10px; margin-bottom: 2px;">
      <button class="quit-app-row-btn" id="btnQuitGravibuddy" title="Quit Gravibuddy completely">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        <span>Quit Gravibuddy</span>
      </button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
